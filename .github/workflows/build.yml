name: Build BepInEx Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    # 1. Автоматическое восстановление NuGet-пакетов для .csproj файла
    - name: Restore dependencies
      run: dotnet restore

    # 2. Сборка проекта в режиме Release
    - name: Build Mod DLL
      run: dotnet build --configuration Release --no-restore

    # 3. Сохранение готового .dll файла в Артефакты
    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SilkWeaverCompanion-Mod
        path: "**/bin/Release/net472/*.dll"
