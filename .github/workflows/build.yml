name: Build BepInEx Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    # 1. Добавляем официальный источник пакетов BepInEx
    - name: Add BepInEx NuGet Source
      run: dotnet nuget add source https://nuget.bepinex.dev/v3/index.json --name BepInEx

    # 2. Восстанавливаем пакеты
    - name: Restore dependencies
      run: dotnet restore

    # 3. Компилируем проект
    - name: Build Mod DLL
      run: dotnet build --configuration Release --no-restore

    # 4. Сохраняем скомпилированный .dll в Артефакты
    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SilkWeaverCompanion-Mod
        path: "**/bin/Release/net472/*.dll"
